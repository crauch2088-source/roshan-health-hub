name: Invoice RPC-only write integration (PostgreSQL 17)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'db/roshan_phase19_invoice_rpc_only_writes.sql'
      - 'db/tests/invoice_rpc_only_writes_fixture.sql'
      - 'db/tests/invoice_rpc_only_writes_integration.sql'
      - '.github/workflows/ci-invoice-rpc-only-writes.yml'

permissions:
  contents: read

jobs:
  invoice-rpc-only-writes:
    name: invoice-rpc-only-writes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Apply fixture, migration, and behavioral regression
        env: { PGPASSWORD: postgres }
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f db/tests/invoice_rpc_only_writes_fixture.sql \
            -f db/roshan_phase19_invoice_rpc_only_writes.sql \
            -f db/tests/invoice_rpc_only_writes_integration.sql
