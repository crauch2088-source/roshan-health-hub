name: Post-expense finite amount regression (PostgreSQL 17)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'db/roshan_post_expense_finite_amount.sql'
      - 'db/roshan_post_expense_money_precision.sql'
      - 'db/tests/post_expense_finite_amount_integration.sql'
      - 'db/tests/finance_only_rpc_writes_fixture.sql'
      - '.github/workflows/ci-post-expense-finite-amount.yml'

permissions:
  contents: read

jobs:
  post-expense-finite-amount:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Apply synthetic finance fixture, candidate, and regression
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f db/tests/finance_only_rpc_writes_fixture.sql \
            -f db/roshan_post_expense_finite_amount.sql \
            -f db/roshan_post_expense_money_precision.sql \
            -f db/tests/post_expense_finite_amount_integration.sql
