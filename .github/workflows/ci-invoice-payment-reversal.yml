name: Source-aware invoice payment reversal (PostgreSQL 17)

on:
  pull_request:
    paths:
      - "db/roshan_phase54_source_aware_financial_reversal.sql"
      - "db/tests/invoice_payment_reversal_fixture.sql"
      - "db/tests/invoice_payment_reversal_assertions.sql"
      - ".github/workflows/ci-invoice-payment-reversal.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase54-financial-reversal-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  invoice-payment-reversal:
    name: Atomic invoice payment and ledger reversal contract
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Build synthetic finance fixture and apply candidate migration
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f db/tests/invoice_payment_reversal_fixture.sql \
            -f db/roshan_phase54_source_aware_financial_reversal.sql
      - name: Assert source-aware reversal invariants
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f db/tests/invoice_payment_reversal_assertions.sql
