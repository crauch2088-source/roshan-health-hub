name: Clinical child branch isolation integration (PostgreSQL 17)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'db/roshan_phase20_clinical_child_branch_isolation.sql'
      - 'db/tests/clinical_child_branch_isolation_fixture.sql'
      - 'db/tests/clinical_child_branch_isolation_integration.sql'
      - 'tests/clinical-rls.test.ts'
      - '.github/workflows/ci-clinical-child-branch-isolation.yml'

jobs:
  clinical-child-branch-isolation:
    name: clinical-child-branch-isolation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixture, migration, and cross-branch regression
        env: { PGPASSWORD: postgres }
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f db/tests/clinical_child_branch_isolation_fixture.sql \
            -f db/roshan_phase20_clinical_child_branch_isolation.sql \
            -f db/tests/clinical_child_branch_isolation_integration.sql
