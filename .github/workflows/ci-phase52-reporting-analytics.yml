name: Phase 52 reporting analytics (PostgreSQL 17)

on:
  pull_request:
    paths:
      - "db/baseline/0000_roshan_pg17_baseline_v112.sql"
      - "db/tests/phase33_storage_realtime_fixture.sql"
      - "db/tests/phase33_storage_realtime_assertions.sql"
      - "db/roshan_phase34_consolidated_storage_realtime_and_lab_verify.sql"
      - "db/roshan_phase48_storage_entity_branch_binding.sql"
      - "db/roshan_phase49_atomic_pharmacy_dispense.sql"
      - "db/roshan_phase50_clinical_visit_bill_completion.sql"
      - "db/roshan_phase51_public_setup_required_anon.sql"
      - "db/roshan_phase52_reporting_analytics.sql"
      - "db/tests/phase48_storage_entity_branch_binding_assertions.sql"
      - "db/tests/phase49_50_critical_path_assertions.sql"
      - "db/tests/phase51_setup_required_anon_assertions.sql"
      - "db/tests/phase52_reporting_analytics_assertions.sql"
      - ".github/workflows/ci-phase52-reporting-analytics.yml"
  push:
    branches: [main]
    paths:
      - "db/roshan_phase52_reporting_analytics.sql"
      - "db/tests/phase52_reporting_analytics_assertions.sql"
      - ".github/workflows/ci-phase52-reporting-analytics.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roshan-phase52-reporting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reporting:
    name: Reporting RPC contract and RLS (PostgreSQL 17)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Replay schema and reporting migrations on disposable PostgreSQL 17
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f db/baseline/0000_roshan_pg17_baseline_v112.sql \
            -f db/tests/phase33_storage_realtime_fixture.sql \
            -f db/roshan_phase34_consolidated_storage_realtime_and_lab_verify.sql \
            -f db/tests/phase33_storage_realtime_assertions.sql \
            -f db/roshan_phase48_storage_entity_branch_binding.sql \
            -f db/roshan_phase49_atomic_pharmacy_dispense.sql \
            -f db/roshan_phase50_clinical_visit_bill_completion.sql \
            -f db/roshan_phase51_public_setup_required_anon.sql \
            -f db/roshan_phase52_reporting_analytics.sql \
            -f db/tests/phase48_storage_entity_branch_binding_assertions.sql \
            -f db/tests/phase49_50_critical_path_assertions.sql \
            -f db/tests/phase51_setup_required_anon_assertions.sql \
            -f db/tests/phase52_reporting_analytics_assertions.sql
      - name: Run Phase 52 source regression
        run: node --test --experimental-strip-types tests/phase52-reporting-analytics.test.ts
