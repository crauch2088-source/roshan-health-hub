name: Roshan Agent Skills validation

on:
  push:
    branches: [main]
    paths:
      - '.agents/skills/**'
      - 'docs/ROSHAN_AGENT_SKILLS_SYSTEM.md'
      - 'tests/agent-skills-contract.test.mjs'
      - 'AGENTS.md'
      - '.github/workflows/agent-skills-validation.yml'
  pull_request:
    paths:
      - '.agents/skills/**'
      - 'docs/ROSHAN_AGENT_SKILLS_SYSTEM.md'
      - 'tests/agent-skills-contract.test.mjs'
      - 'AGENTS.md'
      - '.github/workflows/agent-skills-validation.yml'

permissions:
  contents: read

concurrency:
  group: roshan-agent-skills-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Skill inventory and safety contracts
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate Roshan skill inventory and safety contracts
        run: node --test tests/agent-skills-contract.test.mjs
