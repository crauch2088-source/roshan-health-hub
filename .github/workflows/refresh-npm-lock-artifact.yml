name: Temporary npm lockfile refresh artifact
on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/refresh-npm-lock-artifact.yml"
permissions:
  contents: read
jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate package-lock from the merged package manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate the generated lockfile
        continue-on-error: true
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
