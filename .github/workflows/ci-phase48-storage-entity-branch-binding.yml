name: Phase 48 Storage entity/branch binding (PostgreSQL 17)

on:
  pull_request:
    paths:
      - "db/baseline/0000_roshan_pg17_baseline_v112.sql"
      - "db/tests/phase33_storage_realtime_fixture.sql"
      - "db/tests/phase33_storage_realtime_assertions.sql"
      - "db/roshan_phase34_consolidated_storage_realtime_and_lab_verify.sql"
      - "db/roshan_phase48_storage_entity_branch_binding.sql"
      - "db/tests/phase48_storage_entity_branch_binding_assertions.sql"
      - "src/lib/storage-path.ts"
      - "tests/phase33-storage-realtime.test.ts"
      - "tests/phase34-consolidated.test.ts"
      - ".github/workflows/ci-phase48-storage-entity-branch-binding.yml"
  push:
    branches: [main]
    paths:
      - "db/baseline/0000_roshan_pg17_baseline_v112.sql"
      - "db/tests/phase33_storage_realtime_fixture.sql"
      - "db/tests/phase33_storage_realtime_assertions.sql"
      - "db/roshan_phase34_consolidated_storage_realtime_and_lab_verify.sql"
      - "db/roshan_phase48_storage_entity_branch_binding.sql"
      - "db/tests/phase48_storage_entity_branch_binding_assertions.sql"
      - "src/lib/storage-path.ts"
      - "tests/phase33-storage-realtime.test.ts"
      - "tests/phase34-consolidated.test.ts"
      - ".github/workflows/ci-phase48-storage-entity-branch-binding.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roshan-phase48-storage-entity-binding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase48-storage-entity-binding:
    name: Phase 48 Storage entity/branch binding (PostgreSQL 17)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Replay canonical PostgreSQL 17 baseline and Storage policies
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f db/baseline/0000_roshan_pg17_baseline_v112.sql \
            -f db/tests/phase33_storage_realtime_fixture.sql \
            -f db/roshan_phase34_consolidated_storage_realtime_and_lab_verify.sql \
            -f db/tests/phase33_storage_realtime_assertions.sql \
            -f db/roshan_phase48_storage_entity_branch_binding.sql \
            -f db/tests/phase48_storage_entity_branch_binding_assertions.sql
      - name: Run Storage path and policy source regression tests
        run: |
          node --test --experimental-strip-types \
            tests/phase33-storage-realtime.test.ts \
            tests/phase34-consolidated.test.ts
