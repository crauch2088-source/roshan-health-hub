name: Browser E2E — public routes

on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: "Exact Roshan Vercel preview or production URL to test"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: roshan-browser-e2e-${{ inputs.deployment_url }}
  cancel-in-progress: true

jobs:
  public-routes:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout trusted test harness from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate target deployment URL
        env:
          INPUT_DEPLOYMENT_URL: ${{ inputs.deployment_url }}
        run: node scripts/validate-browser-e2e-target.mjs

      - name: Install pinned browser-test packages without changing the app lockfile
        run: npm install --no-save --package-lock=false @playwright/test@1.64.1 @axe-core/playwright@4.14.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run public-route browser and accessibility tests
        run: npm run test:e2e:public

      - name: Upload browser report and failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: roshan-browser-e2e-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
