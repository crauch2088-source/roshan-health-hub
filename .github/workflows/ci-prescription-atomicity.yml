name: Prescription atomicity integration

on:
  pull_request:
    paths:
      - 'db/**'
      - 'tests/**'
      - '.github/workflows/ci-fix/prescription-atomicity.yml'
  push:
    branches:
      - 'fix/prescription-atomicity'

jobs:
  postgres-integration:
    name: PostgreSQL 17 integration
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run focused regression test
        run: node --test --experimental-strip-types tests/prescription-atomicity.test.ts
      - name: Run SQL integration test
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f db/tests/prescription_rpc_fixture.sql \
            -f db/roshan_phase7_atomic_prescription.sql \
            -f db/tests/prescription_rpc_integration.sql
