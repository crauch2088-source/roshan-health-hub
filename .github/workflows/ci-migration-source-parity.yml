name: Historical migration hashes and forward-source delta

on:
  pull_request:
    paths:
      - 'docs/recovered-migrations/source-parity-report.json'
      - 'docs/recovered-migrations/sql/**'
      - 'db/tests/redacted_migration_policy_replay_integration.sql'
      - 'db/tests/redacted_migration_policy_replay_fixture.sql'
      - 'docs/recovered-migrations/replay-safe/**'
      - 'docs/live-migration-delta-2026-10-18.json'
      - 'docs/LIVE_MIGRATION_DELTA_2026-10-18.md'
      - 'db/roshan_security_candidate_bundle_20261017.sql'
      - 'db/roshan_phase5_insurance_claim_amount_integrity.sql'
      - 'db/roshan_phase5_insurance_coverage_validity.sql'
      - 'db/roshan_phase27_revoke_legacy_invoice_number.sql'
      - 'db/roshan_insurance_prior_authorization_branch_isolation.sql'
      - 'db/roshan_post_expense_finite_amount.sql'
      - 'db/roshan_post_expense_money_precision.sql'
      - 'db/roshan_insurance_claim_money_precision.sql'
      - 'db/tests/post_expense_finite_amount_integration.sql'
      - 'db/tests/finance_only_rpc_writes_fixture.sql'
      - 'db/tests/insurance_claim_money_precision_fixture.sql'
      - 'db/tests/insurance_claim_money_precision_integration.sql'
      - 'scripts/verify-migration-source-parity.py'
      - '.github/workflows/ci-migration-source-parity.yml'
      - '.github/workflows/ci-post-expense-finite-amount.yml'
      - '.github/workflows/ci-insurance-claim-money-precision.yml'
  push:
    branches: [main]
    paths:
      - 'docs/recovered-migrations/source-parity-report.json'
      - 'docs/recovered-migrations/sql/**'
      - 'db/tests/redacted_migration_policy_replay_integration.sql'
      - 'db/tests/redacted_migration_policy_replay_fixture.sql'
      - 'docs/recovered-migrations/replay-safe/**'
      - 'docs/live-migration-delta-2026-10-18.json'
      - 'docs/LIVE_MIGRATION_DELTA_2026-10-18.md'
      - 'db/roshan_security_candidate_bundle_20261017.sql'
      - 'db/roshan_phase5_insurance_claim_amount_integrity.sql'
      - 'db/roshan_phase5_insurance_coverage_validity.sql'
      - 'db/roshan_phase27_revoke_legacy_invoice_number.sql'
      - 'db/roshan_insurance_prior_authorization_branch_isolation.sql'
      - 'db/roshan_post_expense_finite_amount.sql'
      - 'db/roshan_post_expense_money_precision.sql'
      - 'db/roshan_insurance_claim_money_precision.sql'
      - 'db/tests/post_expense_finite_amount_integration.sql'
      - 'db/tests/finance_only_rpc_writes_fixture.sql'
      - 'db/tests/insurance_claim_money_precision_fixture.sql'
      - 'db/tests/insurance_claim_money_precision_integration.sql'
      - 'scripts/verify-migration-source-parity.py'
      - '.github/workflows/ci-migration-source-parity.yml'
      - '.github/workflows/ci-post-expense-finite-amount.yml'
      - '.github/workflows/ci-insurance-claim-money-precision.yml'
      - 'db/roshan_invoice_payment_money_precision.sql'
      - 'db/roshan_pharmacy_batch_money_precision.sql'
      - 'db/tests/invoice_payment_money_precision_fixture.sql'
      - 'db/tests/invoice_payment_money_precision_integration.sql'
      - 'db/tests/pharmacy_batch_money_precision_fixture.sql'
      - 'db/tests/pharmacy_batch_money_precision_integration.sql'
      - '.github/workflows/ci-invoice-payment-money-precision.yml'
      - '.github/workflows/ci-pharmacy-batch-money-precision.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-source-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify historical 93-entry hashes and forward-source delta
        run: python3 scripts/verify-migration-source-parity.py
