name: Insurance claim UI validation

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/ci-insurance-claim-validation.yml'
  push:
    branches:
      - 'fix/insurance-claim-invoice-link'

jobs:
  claim-validation:
    name: Insurance claim validation regression
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run focused insurance claim validation tests
        run: node --test --experimental-strip-types tests/insurance-claim-validation.test.ts
      - name: Verify typecheck, lint, and production build
        run: |
          npm run typecheck
          npm run lint
          npm run build
