name: Phase 55 clinical parent-link and private helper reconciliation (PostgreSQL 17)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'db/roshan_phase36_audit_coverage_and_visit_lifecycle_guards.sql'
      - 'db/roshan_phase55_clinical_parent_guard_acl_reconciliation.sql'
      - 'db/tests/phase36_behavioral_fixture.sql'
      - 'db/tests/phase36_behavioral_assertions.sql'
      - 'db/tests/phase55_legacy_state.sql'
      - 'db/tests/phase55_clinical_parent_guard_assertions.sql'
      - '.github/workflows/ci-phase55-clinical-parent-guard.yml'

permissions:
  contents: read

jobs:
  phase55-clinical-parent-guard:
    name: phase55-clinical-parent-guard
    runs-on: ubuntu-latest
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Apply Phase36 baseline, simulate live drift, and reconcile
        env: { PGPASSWORD: postgres }
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f db/tests/phase36_behavioral_fixture.sql \
            -f db/roshan_phase36_audit_coverage_and_visit_lifecycle_guards.sql \
            -f db/tests/phase55_legacy_state.sql \
            -f db/roshan_phase55_clinical_parent_guard_acl_reconciliation.sql \
            -f db/tests/phase36_behavioral_assertions.sql \
            -f db/tests/phase55_clinical_parent_guard_assertions.sql
