version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: typescript
        update-types:
          - "version-update:semver-major"
      # These major APIs currently break the clinic UI; migrate each separately.
      - dependency-name: react-day-picker
        update-types:
          - "version-update:semver-major"
      - dependency-name: recharts
        update-types:
          - "version-update:semver-major"
      # React Hooks 7 enables additional purity and effect rules that currently fail the UI lint suite.
      - dependency-name: eslint-plugin-react-hooks
        update-types:
          - "version-update:semver-major"
    groups:
      npm-production-patch-minor:
        dependency-type: production
        update-types:
          - minor
          - patch
      npm-development-patch-minor:
        dependency-type: development
        update-types:
          - minor
          - patch
      npm-major-updates:
        patterns:
          - "*"
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: UTC
    open-pull-requests-limit: 2
    groups:
      actions-patch-minor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      actions-major:
        patterns:
          - "*"
        update-types:
          - major
